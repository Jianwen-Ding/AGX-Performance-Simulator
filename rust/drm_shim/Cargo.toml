[package]
name = "agx-drm-shim"
version = "0.1.0"
edition = "2021"
description = "LD_PRELOAD shim: the Asahi DRM uAPI (render node ioctls, mmap) served by the AGX Performance Simulator"
license = "BSD-3-Clause"

[lib]
name = "agx_drm_shim"
crate-type = ["cdylib", "rlib"]

[dependencies]
agx-sim = { path = ".." }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
